spring.application.name=labs

# Spring Boot Server Settings
server.port=22700

# Spring Data JPA and PostgreSQL Settings
spring.datasource.url=jdbc:db-usernameql://localhost:5432/camundaworkflow
spring.datasource.username=db-username
spring.datasource.password=db-password
spring.datasource.driver-class-name=org.db-usernameql.Driver
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Camunda BPM Settings
camunda.bpm.client.base-url=http://localhost:8080/engine-rest
camunda.bpm.client.workerId=labs-worker

# Camunda BPM Settings
#camunda.bpm.application.enabled=true
#camunda.bpm.process-engine-name=default
#camunda.bpm.process-engine-job-executor-deployment-aware=false

# minio
minio.url=http://localhost:9000
minio.accessKey=admin
minio.secretKey=admin1234
minio.bucket=receipt-bucket

# ???????????? JMS
spring.jms.cache.enabled=false
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest